backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/moon-computer # <-- update this after you push to GitHub
  branch: main

media_folder: "public/images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "Files"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "File type"
        name: "ext"
        widget: "select"
        hint: "This becomes the file extension shown on the site (e.g. .hro)"
        options: ["hro", "mnstr", "moon", "w1z"]
      - { label: "Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Shown in the archive listing" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Linked files"
        name: "related"
        widget: "relation"
        collection: "posts"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Optional — link this to other posts, e.g. for a serial"
      - { label: "Hide from site", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Story", name: "body", widget: "markdown" }
