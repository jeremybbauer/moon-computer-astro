backend:
  name: github
  repo: jeremybbauer/moon-computer-astro # <-- update this after you push to GitHub
  branch: main

media_folder: "public/images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "Files"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "File type"
        name: "ext"
        widget: "string"
        hint: "This becomes the file extension shown on the site (e.g. hro, mnstr, rtf — or invent a new one)"
        options: ["hro", "mnstr", "moon", "w1z"]
      - { label: "Date", name: "pubDate", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "Shown in the archive listing" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - label: "Linked files"
        name: "related"
        widget: "relation"
        collection: "posts"
        search_fields: ["title"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        required: false
        hint: "Optional — link this to other posts, e.g. for a serial"
      - { label: "Hide from site", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Story", name: "body", widget: "markdown" }
          summary: "{{title}} — .{{fields.ext}} — {{pubDate}}"
          sortable_fields:
            fields: [pubDate, title]
            default:
              field: pubDate
              direction: descending
          view_groups:
            field: ext
          view_filters:
            - { label: "Horror (.hro)", field: ext, pattern: hro }
            - { label: "Monsters (.mnstr)", field: ext, pattern: mnstr }
            - { label: "Moon (.moon)", field: ext, pattern: moon }
            - { label: "Wizard (.w1z)", field: ext, pattern: w1z }
            - { label: "RTF (.rtf)", field: ext, pattern: rtf }
      
      